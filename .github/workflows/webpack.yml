name: Option Dashboard Trading Session

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
    - cron: "47 6 * * *"

permissions:
  contents: write

concurrency:
  group: trading
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      # ==========================================
      # TEST GITHUB ENVIRONMENT SECRETS
      # ==========================================
      - name: Test GitHub Secrets
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "========================================="
          echo "       TESTING GITHUB SECRETS"
          echo "========================================="

          echo "UPSTOX_TOKEN length: ${#UPSTOX_TOKEN}"
          echo "TG_BOT_TOKEN length: ${#TG_BOT_TOKEN}"
          echo "TG_CHAT_ID length: ${#TG_CHAT_ID}"

          if [ -z "$UPSTOX_TOKEN" ]; then
            echo "âŒ UPSTOX_TOKEN is EMPTY"
          else
            echo "âœ… UPSTOX_TOKEN is available"
          fi

          if [ -z "$TG_BOT_TOKEN" ]; then
            echo "âŒ TG_BOT_TOKEN is EMPTY"
          else
            echo "âœ… TG_BOT_TOKEN is available"
          fi

          if [ -z "$TG_CHAT_ID" ]; then
            echo "âŒ TG_CHAT_ID is EMPTY"
          else
            echo "âœ… TG_CHAT_ID is available"
          fi

          if [ -z "$UPSTOX_TOKEN" ] || \
             [ -z "$TG_BOT_TOKEN" ] || \
             [ -z "$TG_CHAT_ID" ]; then

            echo ""
            echo "âŒ One or more GitHub secrets are missing."
            echo "Check Settings â†’ Environments â†’ production â†’ Environment secrets."
            exit 1
          fi

          echo ""
          echo "âœ… ALL GITHUB SECRETS ARE AVAILABLE"
          echo "========================================="

      # ==========================================
      # RUN TRADING SESSION
      # ==========================================
      - name: Run trading session
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          AUTO_EXIT: "1"

        run: |
          echo "=== CHECKING UPSTOX TOKEN ==="

          if [ -z "$UPSTOX_TOKEN" ]; then
            echo "UPSTOX_TOKEN is EMPTY"
            exit 1
          fi

          echo "UPSTOX_TOKEN is present"
          echo "Token length: ${#UPSTOX_TOKEN}"

          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== REPOSITORY FILES ==="
          find . -maxdepth 2 -type f | sort

          echo "=== CHECKING MAIN FILE ==="

          if [ ! -f "./option_dashboard.js" ]; then
            echo "ERROR: option_dashboard.js not found in repository root"
            exit 1
          fi

          echo "option_dashboard.js FOUND"

          CURRENT_UTC_HOUR=$(date -u +%H)

          if [ "$CURRENT_UTC_HOUR" -lt 6 ]; then
            export SESSION_END="12:35"
          else
            export SESSION_END="15:35"
          fi

          echo "Session until $SESSION_END IST"

          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"

          echo "=== SYNCING LATEST STATE ==="
          git pull --rebase origin "${GITHUB_REF_NAME}" || true

          echo "=== STARTING TRADING ENGINE ==="

          node ./option_dashboard.js session &
          ENGINE=$!

          echo "Engine PID: $ENGINE"

          while kill -0 "$ENGINE" 2>/dev/null; do

            CURRENT_IST=$(TZ=Asia/Kolkata date +%H:%M)

            echo "Current IST: $CURRENT_IST"

            if [[ "$CURRENT_IST" > "$SESSION_END" || "$CURRENT_IST" == "$SESSION_END" ]]; then
              echo "Session end reached: $CURRENT_IST IST"
              echo "Stopping trading engine..."

              kill "$ENGINE" 2>/dev/null || true
              break
            fi

            sleep 60

            CURRENT_MINUTE=$(date +%M)

            if [ $((10#$CURRENT_MINUTE % 10)) -eq 0 ]; then

              echo "=== PERIODIC STATE COMMIT ==="

              git add option_dashboard.xlsx positions.json tuning.json 2>/dev/null || true

              if ! git diff --cached --quiet; then
                git commit -m "state: periodic $(date -u +'%Y-%m-%dT%H:%MZ')" || true
                git pull --rebase origin "${GITHUB_REF_NAME}" || true
                git push || true
              else
                echo "No state changes to commit"
              fi

            fi

          done

          wait "$ENGINE" 2>/dev/null || true

          echo "=== TRADING SESSION FINISHED ==="

      # ==========================================
      # FINAL STATE COMMIT
      # ==========================================
      - name: Final state commit
        if: always()
        run: |
          echo "=== FINAL STATE COMMIT ==="

          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"

          git add option_dashboard.xlsx positions.json tuning.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "state: session end $(date -u +'%Y-%m-%dT%H:%MZ')" || true
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push || true
          else
            echo "No final state changes to commit"
          fi